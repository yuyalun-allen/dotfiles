# ==============================================================================
# XDG Base Directory Specification
# ==============================================================================
XDG_CONFIG_HOME="$HOME/.config"
XDG_CACHE_HOME="$HOME/.cache"
XDG_DATA_HOME="$HOME/.local/share"
XDG_STATE_HOME="$HOME/.local/state"
APP_HOME="$HOME/Applications"

# ==============================================================================
# Desktop, GUI & Input Method
# ==============================================================================
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_QPA_PLATFORMTHEME=qt5ct
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
PULSE_COOKIE="$XDG_CONFIG_HOME/pulse/cookie"

# ==============================================================================
# Terminal, Shell & General CLI Tools
# ==============================================================================
EDITOR="vim"
HISTFILE="$XDG_STATE_HOME/bash/history"
PYTHON_HISTORY="$XDG_STATE_HOME/python/history"
GDBHISTFILE="$XDG_DATA_HOME/gdb/history"
GNUPGHOME="$XDG_DATA_HOME/gnupg"
WGETRC="$XDG_CONFIG_HOME/wget/wgetrc"
W3M_DIR="$XDG_CONFIG_HOME/w3m"
NNN_PLUG="f:finder;o:fzopen;p:mocq;d:diffs;t:nmount;v:imgview"

# ==============================================================================
# Languages & Package Managers
# ==============================================================================
# JavaScript / TypeScript / Node.js
NVM_DIR="$HOME/.config/nvm"
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/npmrc"
npm_config_cache="$XDG_CACHE_HOME/npm"
BUN_INSTALL="$XDG_DATA_HOME/bun"

# Rust
RUSTUP_HOME="$XDG_DATA_HOME/rustup"
CARGO_HOME="$XDG_DATA_HOME/cargo"

# Go
GOPATH="$XDG_DATA_HOME/go"
GOMODCACHE="$XDG_CACHE_HOME/go/mod"

# Java / JVM
JAVA_HOME="/usr/lib/jvm/default-runtime"
GRADLE_USER_HOME="$XDG_DATA_HOME/gradle"
JAVACPP_CACHE_DIR="$XDG_CACHE_HOME/javacpp"

# Python
IPYTHONDIR="$XDG_CONFIG_HOME/ipython"
JUPYTER_CONFIG_DIR="$XDG_CONFIG_HOME/jupyter"
STREAMLIT_CONFIG_DIR="$XDG_CONFIG_HOME/streamlit"

# Ruby
RBENV_ROOT="$XDG_DATA_HOME/rbenv"
BUNDLE_USER_CONFIG="$XDG_CONFIG_HOME/bundle/config"
BUNDLE_USER_CACHE="$XDG_CACHE_HOME/bundle"
BUNDLE_USER_PLUGIN="$XDG_DATA_HOME/bundle"

# .NET
DOTNET_CLI_HOME="$XDG_DATA_HOME/dotnet"
NUGET_PACKAGES="$XDG_CACHE_HOME/nuget/packages"

# Haskell
GHCUP_USE_XDG_DIRS=true
STACK_XDG=1

# Lean 4
ELAN_HOME="$XDG_DATA_HOME/elan"

# TeX / LaTeX
TEXMFHOME="$XDG_DATA_HOME/texmf"
TEXMFVAR="$XDG_CACHE_HOME/texlive/texmf-var"
TEXMFCONFIG="$XDG_CONFIG_HOME/texlive/texmf-config"

# ==============================================================================
# AI, Virtualization & Applications
# ==============================================================================
PI_CODING_AGENT_DIR="$XDG_CONFIG_HOME/pi/agent"
OLLAMA_MODELS="$XDG_DATA_HOME/ollama/models"
DOCKER_CONFIG="$XDG_CONFIG_HOME/docker"
WINEPREFIX="$XDG_DATA_HOME/wineprefixes/default"
ANDROID_USER_HOME="$XDG_DATA_HOME/android"

# ==============================================================================
# Proxy (Optional)
# ==============================================================================
# http_proxy="http://localhost:7890"
# https_proxy=$http_proxy
